name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Lint (text, native rules, clang-format, clang-tidy)
        shell: pwsh
        run: ./tools/lint.ps1 -Tidy ${{ github.event_name == 'pull_request' && format('-Base origin/{0}', github.base_ref) || '' }}
      - name: Check localization tables
        shell: pwsh
        run: ./tools/check-localization.ps1
      - name: Test localization validation
        shell: pwsh
        run: ./tools/tests/check-localization.tests.ps1
      - name: Build native, settings, the tests and the portable package
        shell: pwsh
        run: ./tools/build.ps1 -Zip -Tests
      - name: Run native and settings regression checks
        shell: pwsh
        run: |
          ctest --test-dir native/build/win-x64 -C Release --output-on-failure --timeout 60
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/SettingsChecks/SettingsChecks.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/LocalizationChecks/LocalizationChecks.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: Atrium-win-x64
          path: dist/*.zip
          if-no-files-found: error
