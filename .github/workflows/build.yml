name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Visual Studio's LLVM is 19, the runner's newer: the same clang-tidy and clang-format as the developers'.
      - name: Pin clang-tidy and clang-format to 19
        shell: pwsh
        run: |
          python -m pip install --quiet --target "$env:RUNNER_TEMP\llvm" clang-tidy==19.1.0 clang-format==19.1.5
          # The binaries the wheels carry, not their Python launchers.
          Get-ChildItem "$env:RUNNER_TEMP\llvm" -Recurse -Include clang-tidy.exe, clang-format.exe | Where-Object FullName -Match '\\data\\' |
              ForEach-Object DirectoryName | Sort-Object -Unique | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Lint (text, native rules, clang-format, clang-tidy)
        shell: pwsh
        run: ./tools/lint.ps1 -Tidy ${{ github.event_name == 'pull_request' && format('-Base origin/{0}', github.base_ref) || '' }}
      - name: Check localization tables
        shell: pwsh
        run: ./tools/check-localization.ps1
      - name: Test localization validation
        shell: pwsh
        run: ./tools/tests/check-localization.tests.ps1
      - name: Build native, settings, the tests and the portable package
        shell: pwsh
        run: ./tools/build.ps1 -Zip -Tests
      - name: Run native and settings regression checks
        shell: pwsh
        run: |
          ctest --test-dir native/build/win-x64 -C Release --output-on-failure --timeout 60
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/SettingsChecks/SettingsChecks.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/LocalizationChecks/LocalizationChecks.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: Atrium-win-x64
          path: dist/*.zip
          if-no-files-found: error
